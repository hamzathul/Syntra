name: Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: 🏷️ Label PR by changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.repository == 'hamzathul/Syntra'
    steps:
      - uses: actions/labeler@v7
