name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20
  PNPM_VERSION: latest
  DATABASE_URL: postgres://syntra:syntra-dev@localhost:5432/defaultdb

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: syntra
          POSTGRES_PASSWORD: syntra-dev
          POSTGRES_DB: defaultdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Create ERP database
        run: >
          docker exec ${{ job.services.postgres.id }}
          psql -U syntra -d defaultdb -c "CREATE DATABASE erp"

      - name: Apply Core migrations
        run: pnpm --filter core db:migrate:prod

      - name: Apply ERP migrations
        run: >
          DATABASE_URL=postgres://syntra:syntra-dev@localhost:5432/erp
          pnpm --filter erp db:migrate:prod

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm check-types

      - name: Test
        run: pnpm test
