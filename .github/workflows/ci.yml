name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24
  DATABASE_URL: postgres://syntra:syntra-dev@localhost:5432/defaultdb

jobs:
  ai:
    name: AI (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/ai
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: apps/ai/.python-version

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src

      - name: Test
        run: uv run pytest

  docker:
    name: Docker (AI image)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Build AI image (no push)
        run: docker build -t syntra-ai:ci ./apps/ai

      - name: Scan image with Trivy (report-only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: syntra-ai:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: syntra
          POSTGRES_PASSWORD: syntra-dev
          POSTGRES_DB: defaultdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Create ERP database
        run: >
          docker exec ${{ job.services.postgres.id }}
          psql -U syntra -d defaultdb -c "CREATE DATABASE erp"

      - name: Apply Core migrations
        run: pnpm --filter core db:migrate:prod

      - name: Apply ERP migrations
        run: >
          DATABASE_URL=postgres://syntra:syntra-dev@localhost:5432/erp
          pnpm --filter erp db:migrate:prod

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm check-types

      - name: Test
        run: pnpm test
