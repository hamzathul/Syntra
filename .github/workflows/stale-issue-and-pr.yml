---
name: Stale Issue And PR

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: 🧹 Clean up stale issues and PRs
    runs-on: ubuntu-latest
    if: github.repository == 'hamzathul/Syntra'
    steps:
      - name: 🚀 Stale Issue And PR
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 30
          days-before-close: 7
          remove-stale-when-updated: true
          stale-issue-label: "stale"
          exempt-issue-labels: "no-stale,help-wanted,security"
          stale-issue-message: >
            There hasn't been any activity on this issue recently, and in order to prioritize active issues, it will be
            marked as stale. Please update to the latest `dev` and check if that solves the issue. Let us know by leaving
            a comment — because this issue is marked as stale, it will be closed in 7 days if no further activity occurs.
            Thank you for your contributions!
          stale-pr-label: "stale"
          exempt-pr-labels: "no-stale"
          stale-pr-message: >
            There hasn't been any activity on this pull request recently, and in order to prioritize active work, it has
            been marked as stale. This PR will be closed in 7 days if no further activity occurs. Rebase onto `dev`,
            ensure CI is green, and comment to keep it alive. Thank you for your contributions!
