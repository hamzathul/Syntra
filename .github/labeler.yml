# Area labels, applied automatically by .github/workflows/labeler.yml.
# Keep in sync with release-drafter categories when adding new areas.
frontend:
  - changed-files:
      - any-glob-to-any-file: 'apps/frontend/**'

core:
  - changed-files:
      - any-glob-to-any-file: 'apps/backend/**'

erp:
  - changed-files:
      - any-glob-to-any-file: 'apps/erp/**'

ai:
  - changed-files:
      - any-glob-to-any-file: 'apps/ai/**'

shared:
  - changed-files:
      - any-glob-to-any-file: 'packages/shared/**'

backend-p:
  - changed-files:
      - any-glob-to-any-file: 'packages/backend/**'

database:
  - changed-files:
      - any-glob-to-any-file:
          - 'apps/**/prisma/**'
          - 'scripts/**'

docs:
  - changed-files:
      - any-glob-to-any-file: '**/*.md'

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - 'pnpm-lock.yaml'
          - 'apps/ai/uv.lock'
          - 'apps/ai/pyproject.toml'

infra:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - '.devcontainer/**'
          - 'docker-compose*.yml'
          - 'turbo.json'
          - 'pnpm-workspace.yaml'
          - 'package.json'
          - 'renovate.json'
          - '.editorconfig'
          - '.gitattributes'
